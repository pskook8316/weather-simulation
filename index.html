<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전국 일주일 날씨 시뮬레이션</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#1b2430;--mut:#6b7686;--bd:#dfe5ee;--ac:#2f6fed}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#19212b;--tx:#e8edf3;--mut:#93a0b1;--bd:#2a3542;--ac:#6b9bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Malgun Gothic",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 18px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;cursor:pointer}
button.on{background:var(--ac);border-color:var(--ac);color:#fff}
svg{width:100%;height:auto;display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}
.mut{color:var(--mut);font-size:12px}
#status{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<main>
<h1>전국 일주일 날씨 시뮬레이션</h1>
<p class="sub">Open-Meteo 7일 예보 + 몬테카를로 불확실성 시뮬레이션 · <span id="status">불러오는 중…</span></p>

<div class="card">
  <h2>전국 지도 (점 지도)</h2>
  <div class="days" id="days"></div>
  <div class="days" id="metric"></div>
  <svg id="map" viewBox="0 0 520 560" role="img" aria-label="전국 날씨 지도"></svg>
  <div class="mut" id="legend"></div>
</div>

<div class="card">
  <h2>도시별 시뮬레이션 (200회)</h2>
  <p class="mut">예보값을 평균으로, 예보 일수가 멀어질수록 오차가 커지는 노이즈(자기상관 랜덤워크)를 더해 200번 돌린 결과입니다. 띠는 10~90% 범위, 선은 중앙값입니다.</p>
  <select id="city"></select>
  <svg id="chart" viewBox="0 0 640 260" role="img" aria-label="기온 시뮬레이션 차트"></svg>
  <div id="rain" class="mut"></div>
</div>

<div class="card">
  <h2>전체 표 <span class="mut">(최저/최고 · 강수확률)</span></h2>
  <div style="overflow-x:auto"><table id="tbl"></table></div>
</div>
<p class="mut">데이터: Open-Meteo (CC BY 4.0). 시뮬레이션은 학습용이며 공식 예보가 아닙니다.</p>
</main>
<script>
const CITIES=[["서울",37.57,126.98],["인천",37.46,126.71],["수원",37.26,127.03],["춘천",37.88,127.73],["강릉",37.75,128.88],["청주",36.64,127.49],["세종",36.48,127.29],["대전",36.35,127.38],["안동",36.57,128.73],["전주",35.82,127.15],["대구",35.87,128.60],["포항",36.02,129.37],["광주",35.16,126.85],["울산",35.54,129.31],["부산",35.18,129.08],["목포",34.81,126.39],["제주",33.50,126.53]];
const N=200, DAYS=7;
let data=[], sim=[], day=0, metric="tmax";
const $=id=>document.getElementById(id);
const WD=["일","월","화","수","목","금","토"];
function dlabel(s,i){const d=new Date(s+"T00:00:00");return i===0?"오늘":`${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`}

// 재현 가능한 난수(mulberry32) + Box-Muller
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){return Math.sqrt(-2*Math.log(r()||1e-9))*Math.cos(2*Math.PI*r())}
const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(p*s.length))]};

function simulate(c,ci){
  const r=rng(1234+ci*97), out={tmax:[],tmin:[],rainDays:[]};
  for(let d=0;d<DAYS;d++){out.tmax.push([]);out.tmin.push([])}
  for(let n=0;n<N;n++){
    let e=0,rd=0;
    for(let d=0;d<DAYS;d++){
      const sd=0.7+0.45*d;                       // 리드타임에 따라 커지는 오차
      e=0.6*e+gauss(r)*sd*0.8;                   // 일간 상관된 오차
      out.tmax[d].push(c.tmax[d]+e);
      out.tmin[d].push(c.tmin[d]+e*0.9+gauss(r)*0.3);
      const p=Math.min(1,Math.max(0,c.pop[d]/100+gauss(r)*0.05*d)); // 강수확률 불확실성
      if(r()<p) rd++;
    }
    out.rainDays.push(rd);
  }
  return out;
}

async function load(){
  const lat=CITIES.map(c=>c[1]).join(), lon=CITIES.map(c=>c[2]).join();
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max&timezone=Asia%2FSeoul&forecast_days=${DAYS}`;
  const res=await fetch(url); if(!res.ok) throw new Error("HTTP "+res.status);
  const j=await res.json(), arr=Array.isArray(j)?j:[j];
  data=arr.map((x,i)=>({name:CITIES[i][0],lat:CITIES[i][1],lon:CITIES[i][2],dates:x.daily.time,
    tmax:x.daily.temperature_2m_max,tmin:x.daily.temperature_2m_min,
    pop:x.daily.precipitation_probability_max.map(v=>v??0),wind:x.daily.wind_speed_10m_max}));
  sim=data.map(simulate);
}

function color(v,m){
  if(m==="pop"){const t=v/100;return `hsl(210 ${30+60*t}% ${85-45*t}%)`}
  if(m==="wind"){const t=Math.min(1,v/40);return `hsl(150 ${30+50*t}% ${85-45*t}%)`}
  const t=Math.max(0,Math.min(1,(v+5)/35));return `hsl(${220-220*t} 80% 60%)`;
}
const METRICS={tmax:["최고기온","°C"],tmin:["최저기온","°C"],pop:["강수확률","%"],wind:["풍속","km/h"]};

function drawMap(){
  const W=520,H=560,x=lo=>(lo-125.6)/4.2*W,y=la=>(38.2-la)/5.2*H;
  let s="";
  data.forEach(c=>{
    const v=c[metric][day], cx=x(c.lon), cy=y(c.lat);
    s+=`<circle cx="${cx}" cy="${cy}" r="22" fill="${color(v,metric)}" stroke="rgba(0,0,0,.25)"/>`+
       `<text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="12" font-weight="600" fill="#111">${c.name}</text>`+
       `<text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="12" fill="#111">${Math.round(v)}${METRICS[metric][1]}</text>`;
  });
  $("map").innerHTML=s;
  $("legend").textContent=`${dlabel(data[0].dates[day],day)} · ${METRICS[metric][0]} (위치는 위경도 기준 개략 배치)`;
}

function drawChart(){
  const i=+$("city").value, c=data[i], S=sim[i];
  const W=640,H=260,L=40,R=12,T=18,B=30, pw=W-L-R, ph=H-T-B;
  const hi=[],lo=[],med=[],mhi=[],mlo=[],mmed=[];
  for(let d=0;d<DAYS;d++){hi.push(q(S.tmax[d],.9));lo.push(q(S.tmax[d],.1));med.push(q(S.tmax[d],.5));
    mhi.push(q(S.tmin[d],.9));mlo.push(q(S.tmin[d],.1));mmed.push(q(S.tmin[d],.5))}
  const all=[...hi,...lo,...mhi,...mlo], mn=Math.floor(Math.min(...all)-1), mx=Math.ceil(Math.max(...all)+1);
  const X=d=>L+pw*d/(DAYS-1), Y=v=>T+ph*(1-(v-mn)/(mx-mn));
  const band=(a,b,col)=>{
    const top=a.map((v,d)=>X(d)+","+Y(v)).join("L");
    const bot=b.map((v,d)=>X(d)+","+Y(v)).reverse().join("L");
    return `<path d="M${top}L${bot}Z" fill="${col}" opacity=".22"/>`};
  const line=(a,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2.2" points="${a.map((v,d)=>X(d)+","+Y(v)).join(" ")}"/>`;
  let s="";
  const step=Math.max(1,Math.round((mx-mn)/5));
  for(let v=mn;v<=mx;v+=step) s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".12"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".7">${v}°</text>`;
  c.dates.forEach((d,k)=>s+=`<text x="${X(k)}" y="${H-10}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">${dlabel(d,k)}</text>`);
  s+=band(hi,lo,"#e5484d")+band(mhi,mlo,"#2f6fed")+line(med,"#e5484d")+line(mmed,"#2f6fed");
  s+=`<text x="${L+6}" y="12" font-size="11" fill="#e5484d">● 최고</text><text x="${L+56}" y="12" font-size="11" fill="#2f6fed">● 최저</text>`;
  $("chart").innerHTML=s;
  const avg=S.rainDays.reduce((a,b)=>a+b,0)/N, p3=S.rainDays.filter(n=>n>=3).length/N*100;
  $("rain").textContent=`${c.name}: 7일 중 비 오는 날 평균 ${avg.toFixed(1)}일 · 3일 이상 비 올 확률 ${p3.toFixed(0)}%`;
}

function drawTable(){
  let h=`<tr><th>도시</th>${data[0].dates.map((d,i)=>`<th>${dlabel(d,i)}</th>`).join("")}</tr>`;
  data.forEach(c=>h+=`<tr><td>${c.name}</td>${c.tmax.map((v,i)=>`<td>${Math.round(c.tmin[i])}/${Math.round(v)}° <span class="mut">${c.pop[i]}%</span></td>`).join("")}</tr>`);
  $("tbl").innerHTML=h;
}

function ui(){
  $("days").innerHTML=data[0].dates.map((d,i)=>`<button data-d="${i}" class="${i===day?"on":""}">${dlabel(d,i)}</button>`).join("");
  $("metric").innerHTML=Object.entries(METRICS).map(([k,v])=>`<button data-m="${k}" class="${k===metric?"on":""}">${v[0]}</button>`).join("");
  $("days").onclick=e=>{if(e.target.dataset.d!=null){day=+e.target.dataset.d;ui();drawMap()}};
  $("metric").onclick=e=>{if(e.target.dataset.m){metric=e.target.dataset.m;ui();drawMap()}};
}

(async()=>{
  try{
    await load();
    $("city").innerHTML=data.map((c,i)=>`<option value="${i}">${c.name}</option>`).join("");
    $("city").onchange=drawChart;
    ui();drawMap();drawChart();drawTable();
    $("status").textContent="업데이트: "+new Date().toLocaleString("ko-KR");
  }catch(err){$("status").textContent="데이터를 불러오지 못했습니다: "+err.message}
})();
</script>
</body>
</html>
